<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattfly Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #3b82f6;
        }

        .search-bar:focus-within {
            ring: 2px solid #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Header Section -->
    <header class="w-full max-w-6xl text-center mb-12 mt-10">
        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 mb-8 tracking-tight">
            Cattfly <span class="text-blue-600">Center</span>
        </h1>
        
        <!-- Search Bar -->
        <div class="max-w-md mx-auto relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-search text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
            </div>
            <input type="text" id="searchInput" 
                class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-2xl leading-5 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent sm:text-sm transition-all shadow-sm" 
                placeholder="Cari link...">
        </div>
    </header>

    <!-- Cards Grid -->
    <main class="w-full max-w-2xl">
        <div id="linksGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            
            <!-- Card 1: Pusat Preset -->
            <a href="https://cattflylab.vercel.app/" target="_blank" class="link-card glass-card rounded-3xl p-6 flex flex-col h-full group">
                <div class="w-12 h-12 bg-indigo-100 rounded-2xl flex items-center justify-center mb-4 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    <i class="fas fa-wand-magic-sparkles text-2xl"></i>
                </div>
                <span class="text-xs font-semibold text-indigo-500 uppercase tracking-wider mb-2">Resources</span>
                <h3 class="text-xl font-bold text-slate-800 mb-2">Pusat Preset</h3>
                <p class="text-slate-500 text-sm flex-grow">Akses berbagai kumpulan preset kreatif untuk proyek desain dan editing kamu.</p>
                <div class="mt-4 flex items-center text-blue-600 font-semibold text-sm">
                    Buka Website <i class="fas fa-arrow-right ml-2 transition-transform group-hover:translate-x-1"></i>
                </div>
            </a>

            <!-- Card 2: Cari Key -->
            <a href="https://myxrin2748.github.io/yourkey/" target="_blank" class="link-card glass-card rounded-3xl p-6 flex flex-col h-full group">
                <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center mb-4 text-amber-600 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                    <i class="fas fa-key text-2xl"></i>
                </div>
                <span class="text-xs font-semibold text-amber-500 uppercase tracking-wider mb-2">Utility</span>
                <h3 class="text-xl font-bold text-slate-800 mb-2">Mencari Key</h3>
                <p class="text-slate-500 text-sm flex-grow">Halaman khusus untuk mendapatkan kunci akses atau kode yang kamu butuhkan.</p>
                <div class="mt-4 flex items-center text-blue-600 font-semibold text-sm">
                    Cek Sekarang <i class="fas fa-arrow-right ml-2 transition-transform group-hover:translate-x-1"></i>
                </div>
            </a>

        </div>
    </main>

    <footer class="mt-auto text-center text-slate-400 text-sm py-10">
        <p>&copy; 2024 Cattfly Center. Dibuat dengan rapi.</p>
    </footer>

    <script>
        const searchInput = document.getElementById('searchInput');
        const cards = document.querySelectorAll('.link-card');

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                const desc = card.querySelector('p').innerText.toLowerCase();
                const category = card.querySelector('span').innerText.toLowerCase();

                if (title.includes(searchTerm) || desc.includes(searchTerm) || category.includes(searchTerm)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
